services:
  backend:
    build:
      context: ./backend
    environment:
      NEUROANNOTATE_DATA_DIR: /app/data
      NEUROANNOTATE_DATABASE_URL: sqlite:////app/data/neuroannotate.db
      NEUROANNOTATE_INFERENCE_PROVIDER: ${NEUROANNOTATE_INFERENCE_PROVIDER:-demo}
      NEUROANNOTATE_DEEPISLES_URL: ${NEUROANNOTATE_DEEPISLES_URL:-http://deepisles:8080}
      NEUROANNOTATE_MAX_UPLOAD_MB: 2048
      NEUROANNOTATE_FRONTEND_ORIGIN: http://localhost:5173
      NEUROANNOTATE_SAMPLE_DATA_DIR: /app/sample_data
    volumes:
      - ${NEUROANNOTATE_HOST_DATA_DIR:-./data}:/app/data
      - ./sample_data:/app/sample_data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  deepisles:
    profiles: ["gpu"]
    build:
      context: ./inference-service
    volumes:
      - deepisles-model-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  deepisles-model-cache:
