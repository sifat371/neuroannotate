name: Bootstrap frontend lockfile

on:
  push:
    branches: [chore/pre-release-hardening]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pre-release-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@11 --no-audit --no-fund
      - name: Generate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "build: add deterministic frontend lockfile"
          git push origin HEAD:chore/pre-release-hardening
