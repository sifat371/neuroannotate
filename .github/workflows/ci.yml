name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest tests/test_migrations.py -v
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  inference-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: inference-service/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: ruff check app tests
      - run: pytest -q
      - name: Validate shell helpers
        working-directory: .
        run: |
          bash scripts/tests/test_validate_gpu_helpers.sh
          bash -n scripts/validate_gpu.sh scripts/smoke.sh scripts/tests/test_validate_gpu_helpers.sh inference-service/scripts/fetch_weights.sh

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config >/dev/null
      - run: docker compose --profile gpu config >/dev/null

  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start backend
        run: docker compose up -d --build backend
      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Run deterministic CPU workflow
        run: bash scripts/smoke.sh
      - name: Tear down smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
