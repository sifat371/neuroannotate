[project]
name = "neuroannotate-backend"
version = "1.0.0"
description = "FastAPI backend for NeuroAnnotate"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "nibabel>=5.2,<6",
  "numpy>=1.26,<3",
  "pydicom>=2.4,<4",
  "scipy>=1.13,<2",
  "aiofiles>=24,<25",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0,<7",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
